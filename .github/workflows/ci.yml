name: CI
on:
  push:
    branches: [main, 'feature/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  build:
    name: Contracts, Lint, Typecheck, Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install dependencies
        # Temporary bootstrap: the feature branch predates a committed lockfile.
        # Issue #5 must generate and commit pnpm-lock.yaml, then restore
        # --frozen-lockfile and pnpm caching.
        run: pnpm install --no-frozen-lockfile
      - name: Validate component contracts
        run: pnpm contracts:validate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
