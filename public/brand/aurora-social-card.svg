<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AURORA Collage UI System</title>
  <desc id="desc">Editorial paper collage social card with risograph registration arcs, watercolor fields, and tactile interface fragments.</desc>
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#131313" flood-opacity=".12"/></filter>
    <radialGradient id="washRed"><stop offset="0" stop-color="#E94F4F" stop-opacity=".38"/><stop offset="1" stop-color="#E94F4F" stop-opacity="0"/></radialGradient>
    <radialGradient id="washTeal"><stop offset="0" stop-color="#4CABA2" stop-opacity=".38"/><stop offset="1" stop-color="#4CABA2" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#F6EDE3"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity=".75"/>
  <circle cx="1020" cy="90" r="250" fill="url(#washRed)"/>
  <circle cx="820" cy="560" r="310" fill="url(#washTeal)"/>
  <path d="M0 104h1200" stroke="#131313" stroke-opacity=".12"/>
  <text x="76" y="74" fill="#131313" font-family="monospace" font-size="18" letter-spacing="5">MATERIAL INTERFACE / EDITION 01</text>
  <text x="72" y="255" fill="#131313" font-family="Georgia,serif" font-weight="700" font-size="132">AURORA</text>
  <text x="78" y="316" fill="#383938" font-family="Arial,sans-serif" font-size="31">quiet commerce · tactile storytelling · executable states</text>
  <g transform="translate(78 382)" filter="url(#shadow)">
    <rect width="260" height="112" rx="34" fill="#131313"/>
    <text x="36" y="67" fill="#F6EDE3" font-family="Arial,sans-serif" font-size="24">PRESS / LISTEN / ACT</text>
    <rect x="9" y="8" width="260" height="112" rx="34" fill="none" stroke="#E94F4F" stroke-width="5" opacity=".72"/>
    <rect x="-7" y="-4" width="260" height="112" rx="34" fill="none" stroke="#4CABA2" stroke-width="4" opacity=".62"/>
  </g>
  <g transform="translate(728 170) rotate(-3)" filter="url(#shadow)">
    <rect width="346" height="288" rx="42" fill="#EFE1D0" stroke="#131313" stroke-opacity=".12"/>
    <path d="M46 78h252M46 112h186M46 226h254" stroke="#131313" stroke-opacity=".18" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="174" r="48" fill="#F7B74D" opacity=".88"/>
    <circle cx="123" cy="163" r="48" fill="#E94F4F" opacity=".55" style="mix-blend-mode:multiply"/>
    <circle cx="112" cy="187" r="48" fill="#4CABA2" opacity=".56" style="mix-blend-mode:multiply"/>
    <text x="186" y="180" fill="#131313" font-family="monospace" font-size="15" letter-spacing="2">STATE</text>
    <text x="186" y="205" fill="#131313" font-family="Georgia,serif" font-size="28">registered</text>
  </g>
  <text x="78" y="572" fill="#383938" opacity=".7" font-family="monospace" font-size="17" letter-spacing="3">MELODICBLOOM · REACT · STORYBOOK · ACCESSIBILITY · MOTION</text>
</svg>
